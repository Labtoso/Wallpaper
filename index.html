<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="Wallpaper einzeln oder als Pack herunterladen. In voller Auflösung.">
  <title>Wallpaper</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="gallery.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#sammlung">Zur Sammlung</a>
  <header class="masthead wrap">
    <a class="wordmark" href="./" aria-label="Wallpaper Startseite">wallpaper</a>
    <nav aria-label="Hauptnavigation"><a href="#sammlung">Sammlung</a><a href="#quellen">Quellen</a></nav>
  </header>
  <main class="wrap">
    <section id="sammlung" class="collection" aria-labelledby="collection-title">
      <div class="collection-heading">
        <div><h1 id="collection-title">Alle Wallpaper</h1><span id="collection-count" class="muted"></span></div>
        <a id="pack-download" class="download-link" download hidden>Alle herunterladen <span aria-hidden="true">↓</span></a>
      </div>
      <div class="toolbar">
        <div id="filters" class="filters" role="group" aria-label="Kategorien"></div>
        <button id="shuffle" class="text-button" title="Zufälliges Bild öffnen">Zufallsbild <span aria-hidden="true">↗</span></button>
      </div>
      <p id="result-status" class="sr-only" aria-live="polite"></p>
      <div id="gallery" aria-busy="true"></div>
      <div class="collection-end"><span id="visible-count"></span><a href="#sammlung">Nach oben ↑</a></div>
    </section>
    <section id="quellen" class="sources" aria-labelledby="sources-title">
      <h2 id="sources-title">Quellen</h2>
      <div><div id="source-links" class="source-links"></div><details><summary>Bildnachweise <span id="source-count"></span></summary><ul id="source-list"></ul></details></div>
    </section>
  </main>
  <footer class="wrap"><a href="./">wallpaper</a><span>© <span id="copyright-year">2026</span> Labtoso</span></footer>
  <dialog id="viewer" aria-labelledby="viewer-title">
    <header class="viewer-top">
      <div class="viewer-heading"><h2 id="viewer-title"></h2><span id="viewer-counter" class="muted"></span></div>
      <div class="viewer-actions">
        <button id="viewer-save" class="icon-button" aria-label="Bild merken" title="Merken"></button>
        <button id="viewer-zoom" class="text-button" aria-pressed="false" title="Originalgröße anzeigen">100 %</button>
        <a id="viewer-download" class="download-link" download aria-label="Bild herunterladen">Herunterladen <span aria-hidden="true">↓</span></a>
        <button id="viewer-close" class="icon-button close-button" aria-label="Bildansicht schließen" title="Schließen (Esc)">×</button>
      </div>
    </header>
    <div class="viewer-stage">
      <button id="viewer-prev" class="viewer-arrow previous icon-button" aria-label="Vorheriges Bild" title="Vorheriges Bild (←)">‹</button>
      <div id="viewer-canvas" class="viewer-canvas"><img id="viewer-image" alt="" draggable="false"><p id="viewer-message" role="status"></p></div>
      <button id="viewer-next" class="viewer-arrow next icon-button" aria-label="Nächstes Bild" title="Nächstes Bild (→)">›</button>
    </div>
    <div class="viewer-caption"><span id="viewer-size" class="muted"></span><div id="viewer-credit"></div></div>
    <nav id="viewer-thumbs" class="viewer-thumbs" aria-label="Weitere Bilder"></nav>
  </dialog>
  <noscript><p class="wrap">Zum Anzeigen der Sammlung bitte JavaScript aktivieren.</p></noscript>
</body>
</html>
